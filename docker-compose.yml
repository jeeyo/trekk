services:
  trekk:
    build: .
    image: ghcr.io/jeeyo/trekk:latest
    ports:
      - '8080:8080'
    environment:
      TILE_CACHE_MAX_SIZE: 20g
      TILE_CACHE_TTL: 30d
      RATE_LIMIT: 60r/s
      RATE_BURST: '400'
      # IP range of your TLS-terminating reverse proxy, so rate limits see real client IPs.
      TRUSTED_PROXY_CIDR: 172.16.0.0/12
      CONTACT: https://github.com/jeeyo/trekk
    volumes:
      - tile-cache:/var/cache/trekk
    restart: unless-stopped

volumes:
  tile-cache:
